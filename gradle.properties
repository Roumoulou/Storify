# La JVM du daemon, le cache de build et les JDK (installations.paths, jamais téléchargés)
# sont réglés globalement dans GRADLE_USER_HOME (C:\Dev\Gradle\home\gradle.properties).
# Ici, seulement ce qui est propre au projet.
kotlin.code.style=official

# Le cache de configuration est allumé, comme chez Outfitter : mesuré vert le 2026-10-19 sur
# un build complet, tests, preuves de la variante Java 11 et publication locale compris (une
# entrée stockée, puis réutilisée). Une closure de tâche n'y capture jamais une valeur du
# script (build.gradle.kts, sections 5 et 7), et le jeton Repsy n'entre que par sa présence.
org.gradle.configuration-cache=true

# L'identité de l'artefact : fr.moulou:storify, publié en deux variantes sous cette
# coordonnée, Java 25 et Java 11 (build.gradle.kts, section 4). lib_version est la seule
# place de la version : master porte la prochaine en -SNAPSHOT, une release la perd le
# temps d'un commit et d'un tag (git-et-versions.md, The Human Readme, chapitre 3), puis
# master repart au numéro suivant. Le banc, en composite, ignore ce numéro.
lib_version=0.9.0-SNAPSHOT
maven_group=fr.moulou
archives_base_name=storify
