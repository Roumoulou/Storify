[versions]

# ── Plugins de build ──────────────────────────────────────────────────────────
kotlin = "2.4.21" # Le compilateur Kotlin. La même version que fabric-language-kotlin (1.14.2+kotlin.2.4.21), qui fournit la stdlib et reflect au runtime d'un mod : un consommateur reçoit du bytecode compilé par ce Kotlin-là
java = "25" # La cible de la lib et sa toolchain. La variante Java 11 vise 11 par le build (section 3), pas par le catalogue

# ── Tests ─────────────────────────────────────────────────────────────────────
# JUnit seul : l'agrégat `junit-jupiter` porte l'api, les tests paramétrés et le moteur. JUnit 6 exige Java 17 : la suite tourne sur la
# toolchain 25, jamais sur Java 11, que l'essai de fumée du build éprouve à sa place (section 7).
junit = "6.1.3"

# ── Dépendances ───────────────────────────────────────────────────────────────
# tomlkt, le format TOML : en bytecode Java 8 depuis toujours, sans API absente de Java 8 (relevé du 2026-10-18) ; un mod l'embarque avec
# Storify en jar-in-jar, fabric-language-kotlin ne la fournissant pas.
tomlkt = "0.6.1"
# kotlinx-serialization et kotlinx-datetime : fournies au runtime d'un mod par fabric-language-kotlin, à ces versions exactement ; ici, la
# compilation et les tests. CBOR ne sert qu'aux tests, au benchmark des copies profondes (C-29).
kotlinx-serialization = "1.11.0"
kotlinx-datetime = "0.8.0"
# slf4j : le jeu le fournit depuis Minecraft 1.17.1 (1.8.0-beta4, puis 2.0.x), 1.16.5 pas, et les dix méthodes que la lib appelle existent dans
# toutes ces versions. Ici, la 2.0.20 pour compiler, et slf4j-simple pour lire les logs de la lib dans les tests.
slf4j = "2.0.20"
# kotlin-json5 n'est plus ici : copiée dans les sources, sous internal\json5 (C-65), un jar de moins pour un mod et un paquet relocalisé (build, section 2).


[libraries]

# ── Dépendances ───────────────────────────────────────────────────────────────
tomlkt = { module = "dev.eav.tomlkt:tomlkt", version.ref = "tomlkt" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinx-serialization" }
kotlinx-serialization-cbor = { module = "org.jetbrains.kotlinx:kotlinx-serialization-cbor", version.ref = "kotlinx-serialization" }
kotlin-reflect = { module = "org.jetbrains.kotlin:kotlin-reflect", version.ref = "kotlin" }
kotlinx-datetime = { module = "org.jetbrains.kotlinx:kotlinx-datetime", version.ref = "kotlinx-datetime" }

# ── Logging ───────────────────────────────────────────────────────────────────
slf4j-api = { module = "org.slf4j:slf4j-api", version.ref = "slf4j" }
slf4j-simple = { module = "org.slf4j:slf4j-simple", version.ref = "slf4j" }

# ── Tests ─────────────────────────────────────────────────────────────────────
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter", version.ref = "junit" }
# Le lanceur se déclare : depuis Gradle 9, Gradle ne le pose plus de lui-même sur le classpath des tests. Même `version.ref` que Jupiter,
# la plateforme portant le même numéro depuis JUnit 6.
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher", version.ref = "junit" }


[plugins]

kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
