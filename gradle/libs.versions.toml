[versions]

# -- Plugins de build ----------------------------------------------------------
kotlin = "2.4.20"
java = "25"

# -- Test ----------------------------------------------------------------------
junit = "6.1.3"

# -- Dépendances ---------------------------------------------------------------
tomlkt = "0.6.1"
json5 = "0.8.0"
kotlinx-serialization = "1.11.0"
slf4j = "2.0.20"
kotlinx-datetime = "0.8.0"

[libraries]

# -- Bibliotheques -------------------------------------------------------------
tomlkt = { module = "dev.eav.tomlkt:tomlkt", version.ref = "tomlkt" }
json5 = { module = "li.songe:json5", version.ref = "json5" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinx-serialization" }
kotlinx-serialization-cbor = { module = "org.jetbrains.kotlinx:kotlinx-serialization-cbor", version.ref = "kotlinx-serialization" }
kotlin-reflect = { module = "org.jetbrains.kotlin:kotlin-reflect", version.ref = "kotlin" }
kotlinx-datetime = { module = "org.jetbrains.kotlinx:kotlinx-datetime", version.ref = "kotlinx-datetime" }

# -- Logging -------------------------------------------------------------------
slf4j-api = { group = "org.slf4j", name = "slf4j-api", version.ref = "slf4j" }
slf4j-simple = { group = "org.slf4j", name = "slf4j-simple", version.ref = "slf4j" }

# -- Test : JUnit 6 ------------------------------------------------------------
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter", version.ref = "junit" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher", version.ref = "junit" }

[plugins]

# -- Plugins Gradle ------------------------------------------------------------
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
